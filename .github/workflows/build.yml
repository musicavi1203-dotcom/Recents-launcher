name: build-launcher

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Clone Launcher3 source
        run: git clone --depth 1 --branch lineage-24.0 https://github.com/LineageOS/android_packages_apps_Launcher3.git launcher-src

      - name: Rename package
        run: |
          cd launcher-src
          grep -rl "com.android.launcher3" --exclude-dir=.git . | xargs -r sed -i 's/com\.android\.launcher3/com.abraham.recentslauncher/g'

      - name: Replace hidden system color references
        run: |
          cd launcher-src/res
          grep -rl "android:color/system_" . | xargs -r sed -i 's#android:color/system_#@color/system_#g'

      - name: Generate stubs for missing colors and attributes
        run: |
          cd launcher-src/res
          mkdir -p values
          defined_c=$( ( grep -rhoE 'name="[^"]+"' --include=*.xml . | sed 's/name="//;s/"//'; ls color 2>/dev/null | sed 's/\.xml$//' ) | sort -u)
          used_c=$(grep -rhoE '@color/[A-Za-z0-9_]+' . | sed 's#@color/##' | sort -u)
          missing_c=$(comm -23 <(echo "$used_c") <(echo "$defined_c"))
          defined_a=$( (grep -rhoE '<attr name="[^"]+"' . ; grep -rhE 'type="attr"' . | grep -oE 'name="[^"]+"') | sed -E 's/<attr name="//;s/name="//;s/"//' | sort -u)
          used_a=$( (grep -rhoE '<item name="[A-Za-z0-9_]+"' . ; grep -rhoE '[?@]attr/[A-Za-z0-9_]+' .) | sed -E 's/<item name="//;s/"$//;s/[?@]attr\///' | sort -u)
          missing_a=$(comm -23 <(echo "$used_a") <(echo "$defined_a"))
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<resources>'
            for c in $missing_c; do echo "    <color name=\"$c\">#FF000000</color>"; done
            for a in $missing_a; do echo "    <attr name=\"$a\" format=\"reference|color|dimension|float|integer|boolean|string|fraction\"/>"; done
            echo '</resources>'
          } > values/zz_stubs.xml
          echo "missing colors: $(echo "$missing_c" | grep -c .)  missing attrs: $(echo "$missing_a" | grep -c .)"

      - name: Print duplicate resource names in values
        run: |
          cd launcher-src/res
          dups=$(find values -name '*.xml' -print0 | xargs -0 grep -hoE '<(color|attr|string|dimen|integer|bool|fraction|declare-styleable) name="[^"]+"' | sed -E 's/.*name="//;s/"//' | sort | uniq -d)
          echo "duplicate names: $(echo "$dups" | grep -c .)"
          echo "$dups"

      - name: Restore framework and SystemUI class jars
        run: |
          mkdir -p app/libs
          cat libs/fc_part1.bin libs/fc_part2.bin > framework-classes.zip
          unzip -o framework-classes.zip -d app/libs

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-debug
          path: app/build/outputs/apk/debug/*.apk
