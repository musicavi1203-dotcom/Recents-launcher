name: build-launcher

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Clone Launcher3 source
        run: git clone --depth 1 --branch lineage-24.0 https://github.com/LineageOS/android_packages_apps_Launcher3.git launcher-src

      - name: Rename package
        run: |
          cd launcher-src
          grep -rl "com.android.launcher3" --exclude-dir=.git . | xargs -r sed -i 's/com\.android\.launcher3/com.abraham.recentslauncher/g'

      - name: Replace hidden system color references
        run: |
          cd launcher-src/res
          grep -rl "android:color/system_" . ../quickstep/res | xargs -r sed -i 's#android:color/system_#@color/system_#g'

      - name: Remove duplicate bare attr declarations
        run: |
          cd launcher-src/res
          python3 - <<'EOF'
          import re, glob
          files = glob.glob("values*/*.xml") + glob.glob("../quickstep/res/values*/*.xml")
          formatted = set()
          pat_fmt = re.compile(r'<attr\s+name="([^"]+)"\s+format=')
          for f in files:
              formatted |= set(pat_fmt.findall(open(f, encoding="utf-8").read()))
          pat_bare = re.compile(r'[ \t]*<attr\s+name="([^"]+)"\s*/>[ \t]*\n?')
          removed = 0
          for f in files:
              s = open(f, encoding="utf-8").read()
              def repl(m):
                  global removed
                  if m.group(1) in formatted:
                      removed += 1
                      return ""
                  return m.group(0)
              s2 = pat_bare.sub(repl, s)
              if s2 != s:
                  open(f, "w", encoding="utf-8").write(s2)
          print("removed bare duplicate attr declarations:", removed)
          EOF

      - name: Remove quickstep resources that duplicate main resources
        run: |
          cd launcher-src/res
          python3 - <<'EOF'
          import glob, re
          TAGS = "dimen|color|string|integer|bool|fraction"
          main_names = set()
          for f in glob.glob("values*/*.xml"):
              s = open(f, encoding="utf-8").read()
              main_names |= set(re.findall(rf'<({TAGS})\s+name="([^"]+)"', s))
          removed = 0
          for f in glob.glob("../quickstep/res/values*/*.xml"):
              s = open(f, encoding="utf-8").read()
              for tag, name in sorted(main_names):
                  pat = re.compile(rf'[ \t]*<{tag}\s+name="{re.escape(name)}"[^>]*?(?:/>|>.*?</{tag}>)[ \t]*\n?', re.S)
                  s, k = pat.subn("", s)
                  removed += k
              open(f, "w", encoding="utf-8").write(s)
          print("removed quickstep duplicates:", removed)
          EOF

      - name: Generate stubs for missing colors and attributes
        run: |
          cd launcher-src/res
          python3 - <<'EOF'
          import glob, os, re
          xmls = glob.glob("**/*.xml", recursive=True) + glob.glob("../quickstep/res/**/*.xml", recursive=True)
          all_text = "\n".join(open(f, encoding="utf-8", errors="ignore").read() for f in xmls)

          defined_c = set(re.findall(r'name="([^"]+)"', all_text))
          defined_c |= {os.path.splitext(os.path.basename(f))[0] for f in glob.glob("color/*.xml") + glob.glob("../quickstep/res/color/*.xml")}
          used_c = set(re.findall(r'@color/([A-Za-z0-9_]+)', all_text))
          missing_c = sorted(used_c - defined_c)

          # attributes: only the ones the code references but nothing declares
          # (disabledIconAlpha and loadingIconColor come from a module not included here)
          extra_attrs = ["disabledIconAlpha", "loadingIconColor"]

          os.makedirs("values", exist_ok=True)
          lines = ['<?xml version="1.0" encoding="utf-8"?>', '<resources>']
          lines += [f'    <color name="{c}">#FF000000</color>' for c in missing_c]
          lines += [f'    <attr name="{a}" format="reference|color|dimension|float|integer|boolean|string|fraction"/>' for a in extra_attrs]
          lines.append('</resources>')
          open("values/zz_stubs.xml", "w", encoding="utf-8").write("\n".join(lines) + "\n")
          print("missing colors:", len(missing_c), " extra attrs:", len(extra_attrs))
          print(" ".join(missing_c))
          EOF

      - name: Restore framework and SystemUI class jars
        run: |
          mkdir -p app/libs
          cat libs/fc_part1.bin libs/fc_part2.bin > framework-classes.zip
          unzip -o framework-classes.zip -d app/libs

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-debug
          path: app/build/outputs/apk/debug/*.apk
